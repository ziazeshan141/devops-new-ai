name: Boutique CI Pipeline

on:
  push:
    branches:
      - Test

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # BUILD AND PUSH ALL MICROSERVICES TO AWS ECR
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        shell: bash
        run: |
          set -e

          aws ecr get-login-password --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin \
            "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker Image
        shell: bash
        run: |
          set -e

          if [ "${{ matrix.service }}" = "frontend" ]; then
            BUILD_PATH="projects/boutique-microservices/frontend"
          else
            BUILD_PATH="projects/boutique-microservices/backend/services/${{ matrix.service }}"
          fi

          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ matrix.service }}:${IMAGE_TAG}"

          echo "=========================================="
          echo "Service:     ${{ matrix.service }}"
          echo "Build path:  $BUILD_PATH"
          echo "Image tag:   $IMAGE_TAG"
          echo "=========================================="

          docker build \
            -t "$IMAGE_URI" \
            "$BUILD_PATH"

      # --------------------------------------------------------
      # Push Docker image to ECR
      # --------------------------------------------------------
      - name: Push Docker Image
        shell: bash
        run: |
          set -e

          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ matrix.service }}:${IMAGE_TAG}"

          echo "Pushing image:"
          echo "$IMAGE_URI"

          docker push "$IMAGE_URI"


  # ============================================================
  # UPDATE KUBERNETES GITOPS MANIFESTS
  # ============================================================
  update-manifests:
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    permissions:
      contents: write

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Update Kubernetes image tags
      # --------------------------------------------------------
      - name: Update image tags in Kubernetes manifests
        shell: bash
        run: |
          set -e

          NEW_TAG="${{ github.sha }}"
          ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          REGION="${{ secrets.AWS_REGION }}"

          echo "=========================================="
          echo "Updating Kubernetes manifests"
          echo "=========================================="

          # ----------------------------------------------------
          # Backend services
          # ----------------------------------------------------
          for SERVICE in auth gateway orders order-service product-service user-service; do

            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"

            echo ""
            echo "Updating: $MANIFEST"

            if [ ! -f "$MANIFEST" ]; then
              echo "ERROR: Manifest not found: $MANIFEST"
              exit 1
            fi

            IMAGE="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${SERVICE}:${NEW_TAG}"

            echo "New image: $IMAGE"

            sed -i -E \
              "s|^[[:space:]]*image:.*|          image: ${IMAGE}|" \
              "$MANIFEST"

          done

          # ----------------------------------------------------
          # Frontend
          # ----------------------------------------------------
          echo ""
          echo "Updating frontend..."

          FRONTEND_MANIFEST="gitops/k8s/frontend/deployment.yml"

          if [ ! -f "$FRONTEND_MANIFEST" ]; then
            echo "ERROR: Frontend manifest not found: $FRONTEND_MANIFEST"
            exit 1
          fi

          FRONTEND_IMAGE="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/frontend:${NEW_TAG}"

          echo "New frontend image: $FRONTEND_IMAGE"

          sed -i -E \
            "s|^[[:space:]]*image:.*|          image: ${FRONTEND_IMAGE}|" \
            "$FRONTEND_MANIFEST"


      # --------------------------------------------------------
      # Verify manifests
      # --------------------------------------------------------
      - name: Verify Kubernetes image tags
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "BACKEND IMAGES"
          echo "=========================================="

          for SERVICE in auth gateway orders order-service product-service user-service; do

            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"

            echo ""
            echo "--- $SERVICE ---"

            grep "image:" "$MANIFEST"

          done

          echo ""
          echo "=========================================="
          echo "FRONTEND IMAGE"
          echo "=========================================="

          grep "image:" gitops/k8s/frontend/deployment.yml


          echo ""
          echo "=========================================="
          echo "CHECKING FOR UNRESOLVED PLACEHOLDERS"
          echo "=========================================="

          if grep -R "<AWS_ACCOUNT_ID>" gitops/k8s/; then
            echo ""
            echo "ERROR: <AWS_ACCOUNT_ID> still exists in Kubernetes manifests."
            echo "The manifest update was not completed correctly."
            exit 1
          fi

          echo ""
          echo "No unresolved AWS_ACCOUNT_ID placeholders found."


      # --------------------------------------------------------
      # Commit updated manifests
      # --------------------------------------------------------
      - name: Commit updated manifests
        shell: bash
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add gitops/k8s/

          if git diff --staged --quiet; then
            echo "No Kubernetes manifest changes detected."
          else
            git commit \
              -m "ci: update image tags to ${{ github.sha }}"

            git push origin main
          fi