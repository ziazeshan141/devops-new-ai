name: Boutique CI Pipeline

on:
  push:
    branches:
      - Test

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================================
  build-and-push:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Configure AWS credentials
      # ----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ----------------------------------------------------------
      # Login to ECR
      # ----------------------------------------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"


      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------
      - name: Build Docker Image
        run: |

          if [ "${{ matrix.service }}" = "frontend" ]; then
            BUILD_PATH="projects/boutique-microservices/frontend"
          else
            BUILD_PATH="projects/boutique-microservices/backend/services/${{ matrix.service }}"
          fi

          echo "=========================================="
          echo "Service: ${{ matrix.service }}"
          echo "Build path: $BUILD_PATH"
          echo "=========================================="

          docker build \
            -t "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ matrix.service }}:${IMAGE_TAG}" \
            "$BUILD_PATH"


      # ----------------------------------------------------------
      # Push Docker image
      # ----------------------------------------------------------
      - name: Push Docker Image
        run: |

          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ matrix.service }}:${IMAGE_TAG}"

          echo "Pushing image:"
          echo "$IMAGE_URI"

          docker push "$IMAGE_URI"


  # ============================================================
  # UPDATE GITOPS MANIFESTS
  # ============================================================
  update-manifests:

    runs-on: ubuntu-latest

    needs: build-and-push

    permissions:
      contents: write

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Replace image names and tags
      # ----------------------------------------------------------
      - name: Update image tags in Kubernetes manifests
        run: |

          NEW_TAG="${{ github.sha }}"
          ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          REGION="${{ secrets.AWS_REGION }}"

          echo "=========================================="
          echo "Updating Kubernetes manifests"
          echo "=========================================="

          echo "Region: $REGION"
          echo "Tag: $NEW_TAG"

          # ------------------------------------------------------
          # Backend services
          # ------------------------------------------------------

          for SERVICE in auth gateway orders order-service product-service user-service
          do

            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"

            echo ""
            echo "Updating: $MANIFEST"

            if [ ! -f "$MANIFEST" ]; then
              echo "ERROR: Manifest does not exist: $MANIFEST"
              exit 1
            fi

            IMAGE="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${SERVICE}:${NEW_TAG}"

            echo "New image: $IMAGE"

            sed -i "s|^[[:space:]]*image:.*|          image: ${IMAGE}|" "$MANIFEST"

          done


          # ------------------------------------------------------
          # Frontend
          # ------------------------------------------------------

          FRONTEND_MANIFEST="gitops/k8s/frontend/deployment.yml"

          echo ""
          echo "Updating: $FRONTEND_MANIFEST"

          if [ ! -f "$FRONTEND_MANIFEST" ]; then
            echo "ERROR: Frontend manifest does not exist"
            exit 1
          fi

          FRONTEND_IMAGE="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/frontend:${NEW_TAG}"

          echo "New image: $FRONTEND_IMAGE"

          sed -i "s|^[[:space:]]*image:.*|          image: ${FRONTEND_IMAGE}|" "$FRONTEND_MANIFEST"


      # ----------------------------------------------------------
      # Verify generated manifests
      # ----------------------------------------------------------
      - name: Verify image tags
        run: |

          echo ""
          echo "=========================================="
          echo "BACKEND IMAGES"
          echo "=========================================="

          for SERVICE in auth gateway orders order-service product-service user-service
          do
            echo ""
            echo "$SERVICE:"
            grep "^[[:space:]]*image:" "gitops/k8s/backend/${SERVICE}.yml"
          done


          echo ""
          echo "=========================================="
          echo "FRONTEND IMAGE"
          echo "=========================================="

          grep "^[[:space:]]*image:" gitops/k8s/frontend/deployment.yml


          echo ""
          echo "=========================================="
          echo "CHECK FOR PLACEHOLDER"
          echo "=========================================="

          if grep -R "<AWS_ACCOUNT_ID>" gitops/k8s/; then
            echo ""
            echo "ERROR: <AWS_ACCOUNT_ID> still exists in manifests!"
            exit 1
          fi

          echo ""
          echo "SUCCESS: No AWS account placeholder found."


      # ----------------------------------------------------------
      # Commit changes
      # ----------------------------------------------------------
      - name: Commit and push updated manifests
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add gitops/k8s/

          if git diff --staged --quiet; then

            echo "No manifest changes detected."

          else

            git commit \
              -m "ci: update image tags to ${{ github.sha }}"

            git push

          fi